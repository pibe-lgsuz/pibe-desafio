<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DESAFÍO PIBS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
  <style>
:root {
  --bg: #070710;
  --bg2: #0e0e1a;
  --bg3: #12121f;
  --purple: #a020f0;
  --purple-dim: #6b0faa;
  --cyan: #00f0ff;
  --magenta: #ff00cc;
  --white: #eef0ff;
  --gp: 0 0 8px #a020f0, 0 0 22px #a020f070, 0 0 45px #a020f030;
  --gc: 0 0 8px #00f0ff, 0 0 22px #00f0ff70, 0 0 45px #00f0ff30;
  --gm: 0 0 8px #ff00cc, 0 0 22px #ff00cc70, 0 0 45px #ff00cc30;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background:
    radial-gradient(ellipse 60% 55% at 100% 0%, #5a0a3a 0%, transparent 65%),
    radial-gradient(ellipse 50% 45% at 0% 100%, #003322 0%, transparent 60%),
    #060608;
  color: var(--white);
  font-family: 'Rajdhani', sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,240,255,0.007) 3px, rgba(0,240,255,0.007) 4px);
  pointer-events: none; z-index: 9998;
}
body::after {
  content: '';
  position: fixed; bottom: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent 0%, #a020f0 20%, #ff00cc 50%, #00f0ff 80%, transparent 100%);
  box-shadow: 0 0 18px #a020f0, 0 0 36px #ff00cc, 0 0 54px #00f0ff;
  z-index: 9997;
}

/* ── HEADER ── */
header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 22px 10px 220px;
  background: #08080f;
  border-bottom: 1px solid #a020f022;
  flex-shrink: 0;
  z-index: 10;
}
.avatar-wrap {
  width: 52px; height: 52px; border-radius: 50%;
  border: 2px solid var(--purple);
  box-shadow: var(--gp); overflow: hidden; flex-shrink: 0;
}
.avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
.header-text h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.55rem; font-weight: 900;
  letter-spacing: 0.1em; line-height: 1;
  color: var(--purple); text-shadow: var(--gp);
}
.header-text h1 span { color: #00d4aa; text-shadow: 0 0 8px #00d4aa, 0 0 22px #00d4aa70, 0 0 45px #00d4aa30; }
.header-text .sub {
  font-size: 0.6rem; letter-spacing: 0.22em;
  color: #9b59b6; text-transform: uppercase; margin-top: 3px;
  font-family: 'Orbitron', sans-serif;
  text-shadow: 0 0 8px #9b59b688;
}
.header-text .sub a {
  color: inherit; text-decoration: none;
  transition: color 0.2s, text-shadow 0.2s;
}
.header-text .sub a:hover {
  color: var(--magenta); text-shadow: var(--gm);
}

/* ── TABS ── */
.tabs-bar {
  display: flex;
  background: #09090f;
  border-bottom: 1px solid #a020f033;
  flex-shrink: 0;
  padding: 0 18px 0 220px;
  gap: 4px;
}
.tab-btn {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 10px 22px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: #444;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s, text-shadow 0.2s;
  position: relative;
  top: 1px;
}
.tab-btn:hover { color: #888; }
.tab-btn.active {
  color: var(--cyan);
  border-bottom-color: var(--cyan);
  text-shadow: var(--gc);
}
.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0; height: 2px;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan);
}

/* ── MAIN ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── WHEEL AREA ── */
.wheel-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  min-width: 0;
  gap: 0;
  padding-bottom: 10px;
  padding-left: 260px;
  padding-top: 40px;
}
.wheel-area::before {
  content: '';
  position: absolute;
  width: 600px; height: 600px; border-radius: 50%;
  background: radial-gradient(circle, #a020f006 0%, transparent 70%);
  pointer-events: none;
}
.wheel-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
#wheelCanvas {
  display: block;
  filter: drop-shadow(0 0 20px #a020f090) drop-shadow(0 0 50px #00f0ff30);
}
.pointer {
  position: absolute;
  right: -22px; top: 50%;
  transform: translateY(-50%);
  width: 0; height: 0;
  border-top: 13px solid transparent;
  border-bottom: 13px solid transparent;
  border-right: 34px solid var(--cyan);
  filter: drop-shadow(0 0 8px var(--cyan)) drop-shadow(0 0 16px var(--cyan));
  z-index: 10;
}
.center-avatar {
  position: absolute;
  border-radius: 50%; overflow: hidden;
  border: 3px solid var(--purple);
  box-shadow: var(--gp), inset 0 0 14px #a020f040;
  z-index: 5; cursor: pointer;
}
.center-avatar img { width: 100%; height: 100%; object-fit: cover; }

/* Spin button — with margin-top for spacing */
.spin-wrap {
  margin-top: 32px;
  flex-shrink: 0;
}
.spin-btn {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.1rem; font-weight: 900;
  letter-spacing: 0.18em; color: #fff;
  background: linear-gradient(135deg, #7b00cc 0%, #a020f0 45%, #c040ff 100%);
  border: 1px solid #c040ff;
  padding: 13px 56px; border-radius: 4px;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.25s;
  box-shadow: 0 0 16px #a020f0, 0 0 36px #a020f050;
  text-transform: uppercase; white-space: nowrap;
}
.spin-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 28px #a020f0, 0 0 60px #a020f070, 0 0 100px #ff00cc30;
}
.spin-btn:active { transform: scale(0.97); }
.spin-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

/* ── SIDE PANEL ── */
.side-panel {
  width: 320px;
  background: var(--bg2);
  border-left: 1px solid #a020f022;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 10px;
  border-bottom: 1px solid #a020f022;
  flex-shrink: 0;
}
.panel-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem; letter-spacing: 0.3em;
  color: var(--cyan); text-shadow: var(--gc); text-transform: uppercase;
}
.count-pill {
  background: #a020f022; border: 1px solid #a020f066;
  color: var(--purple);
  font-family: 'Orbitron', sans-serif;
  font-size: 0.6rem; padding: 3px 10px; border-radius: 20px;
}
.names-scroll {
  display: none;
}
.names-scroll::-webkit-scrollbar { width: 4px; }
.names-scroll::-webkit-scrollbar-track { background: #0d0d1a; }
.names-scroll::-webkit-scrollbar-thumb { background: var(--purple-dim); border-radius: 2px; }
.empty-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 120px; color: #333; gap: 8px;
}
.empty-icon { font-size: 2rem; opacity: 0.3; }
.empty-text { font-size: 0.85rem; letter-spacing: 0.1em; }
.name-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 4px;
  border: 1px solid transparent;
  transition: border-color 0.15s, background 0.15s;
  margin-bottom: 3px;
}
.name-item:hover { background: #a020f00a; border-color: #a020f033; }
.name-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.name-text {
  flex: 1; font-size: 0.95rem; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.del-btn {
  background: transparent; border: 1px solid #ff334444;
  color: #ff3344aa; font-size: 0.7rem;
  padding: 2px 6px; border-radius: 3px; cursor: pointer;
  transition: all 0.15s; opacity: 0;
  font-family: 'Orbitron', sans-serif;
}
.name-item:hover .del-btn { opacity: 1; }
.del-btn:hover { border-color: #ff3344; color: #ff3344; box-shadow: 0 0 8px #ff334460; }
.input-section {
  border-top: 1px solid #a020f022; padding: 14px; flex: 1; display: flex; flex-direction: column;
}
.list-editor-wrap {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.list-editor-label {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.52rem; letter-spacing: 0.25em; color: #444;
  text-transform: uppercase; margin-bottom: 6px;
  display: flex; align-items: center; justify-content: space-between;
}
.list-editor-label span { color: #a020f066; }
#listEditor {
  width: 100%;
  background: #09090f;
  border: 1px solid #a020f044;
  border-radius: 4px;
  color: var(--white);
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.98rem;
  font-weight: 600;
  padding: 10px 12px;
  resize: none;
  flex: 1;
  min-height: 120px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  line-height: 1.7;
  letter-spacing: 0.02em;
}
#listEditor:focus { border-color: var(--cyan); box-shadow: 0 0 12px #00f0ff25; }
#listEditor::placeholder { color: #2a2a3a; font-weight: 400; font-style: italic; }
.editor-hint {
  margin-top: 5px;
  font-size: 0.7rem;
  color: #333;
  font-family: 'Rajdhani', sans-serif;
  letter-spacing: 0.05em;
}
.editor-hint b { color: #a020f088; font-weight: 600; }
.action-row {
  display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;
}
.act-btn {
  flex: 1; font-family: 'Orbitron', sans-serif;
  font-size: 0.58rem; letter-spacing: 0.1em;
  padding: 7px 6px; border-radius: 4px; border: 1px solid;
  cursor: pointer; background: transparent;
  transition: all 0.2s; text-transform: uppercase; white-space: nowrap;
}
.act-cyan { border-color: var(--cyan); color: var(--cyan); }
.act-cyan:hover { background: #00f0ff18; box-shadow: var(--gc); }
.act-magenta { border-color: var(--magenta); color: var(--magenta); }
.act-magenta:hover { background: #ff00cc18; box-shadow: var(--gm); }
.act-danger { border-color: #ff3344; color: #ff3344; }
.act-danger:hover { background: #ff334418; box-shadow: 0 0 10px #ff334460; }
.palette-section {
  border-top: 1px solid #a020f022; padding: 10px 14px; flex-shrink: 0;
}
.pal-label {
  font-family: 'Orbitron', sans-serif; font-size: 0.55rem;
  letter-spacing: 0.25em; color: #444; text-transform: uppercase; margin-bottom: 8px;
}
.pal-row { display: flex; gap: 7px; }
.pal-btn {
  flex: 1; height: 24px; border-radius: 3px;
  border: 2px solid transparent; cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
}
.pal-btn:hover, .pal-btn.active { transform: scaleY(1.35); border-color: #fff; }

/* ── WINNER OVERLAY ── */
#winnerOverlay {
  display: none; position: fixed; inset: 0;
  background: #000000cc; backdrop-filter: blur(6px);
  z-index: 300; align-items: center; justify-content: center;
}
#winnerOverlay.show { display: flex; }
.winner-card {
  background: #0d0d1e; border: 2px solid var(--purple);
  border-radius: 12px; padding: 44px 64px;
  text-align: center;
  box-shadow: var(--gp), 0 0 100px #a020f040;
  position: relative; overflow: hidden;
  animation: pop 0.4s cubic-bezier(.34,1.56,.64,1);
  max-width: 90vw;
}
.winner-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--purple), var(--cyan), var(--magenta));
}
.winner-tab-badge {
  font-family: 'Orbitron', sans-serif; font-size: 0.5rem;
  letter-spacing: 0.3em; color: var(--purple);
  background: #a020f022; border: 1px solid #a020f066;
  padding: 3px 12px; border-radius: 20px;
  margin-bottom: 10px; display: inline-block;
  text-transform: uppercase;
}
@keyframes pop { from {transform:scale(0.5);opacity:0} to {transform:scale(1);opacity:1} }
.winner-eyebrow {
  font-family: 'Orbitron', sans-serif; font-size: 0.65rem;
  letter-spacing: 0.5em; color: var(--cyan); text-shadow: var(--gc); margin-bottom: 14px;
  text-transform: uppercase;
}
.winner-name {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 900;
  color: #fff; text-shadow: var(--gp); margin-bottom: 30px; word-break: break-word;
}
.winner-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.w-btn {
  font-family: 'Orbitron', sans-serif; font-size: 0.65rem;
  letter-spacing: 0.1em; padding: 10px 22px;
  border-radius: 4px; cursor: pointer; text-transform: uppercase; transition: all 0.2s;
}
.w-btn-c { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); }
.w-btn-c:hover { background: #00f0ff22; box-shadow: var(--gc); }
.w-btn-m { background: transparent; border: 1px solid var(--magenta); color: var(--magenta); }
.w-btn-m:hover { background: #ff00cc22; box-shadow: var(--gm); }
#confettiCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 299; }

@media (max-width: 768px) {
  html, body { overflow: auto; }
  .main { flex-direction: column; }
  .side-panel { width: 100%; border-left: none; border-top: 1px solid #a020f022; }
  .wheel-area { min-height: 55vw; padding-bottom: 16px; }
}
</style>
</head>

<script>
// ── PALETTES ────────────────────────────────────────────────────────────
const PALETTES = {
  cyberpunk: ['#7b00d4','#0055cc','#007acc','#005e8a','#4b0099','#2200aa','#006bb5','#3d0080'],
  neon:      ['#cc0066','#990000','#cc6600','#008800','#005599','#6600aa','#cc3300','#007755'],
  galaxy:    ['#1a0050','#002266','#003311','#220044','#001133','#330022','#002233','#110033'],
  fire:      ['#aa1100','#cc4400','#994400','#bb2200','#882200','#cc3300','#aa3300','#993300'],
};

// ── STATE — 3 independent wheels ────────────────────────────────────────
const TAB_NAMES = ['Personajes', 'Tiempos', 'Desafío'];
const KEY = 'desafio_pibs_v3';

let state = {
  activeTab: 0,
  wheels: [
    { names: [], palette: 'cyberpunk' },
    { names: [], palette: 'neon' },
    { names: [], palette: 'fire' },
  ]
};

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && s.wheels && s.wheels.length === 3) state = s;
  } catch(e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
}
function currentWheel() { return state.wheels[state.activeTab]; }

// ── WHEEL CANVAS ────────────────────────────────────────────────────────
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, R;
let angle = 0;
let spinning = false;
let lastWinner = null;
let targetIdx = -1;

// Per-tab angles
let tabAngles = [0, 0, 0];

function sizeWheel() {
  const area = document.querySelector('.wheel-area');
  const spinH = 90; // space for spin button + gap
  const avail = Math.min(area.clientWidth - 80, area.clientHeight - spinH - 20);
  const size = Math.max(180, avail);
  canvas.width = size; canvas.height = size;
  W = H = size; cx = cy = size / 2; R = size / 2 - 4;
  const av = document.getElementById('centerAvatar');
  const avSize = Math.max(44, size * 0.13);
  av.style.width = avSize + 'px'; av.style.height = avSize + 'px';
  drawWheel();
}

function getColors() {
  const pal = currentWheel().palette;
  return PALETTES[pal] || PALETTES.cyberpunk;
}

function drawWheel() {
  if (!W) return;
  ctx.clearRect(0, 0, W, H);
  const names = currentWheel().names;
  const n = names.length;
  const cols = getColors();

  if (n === 0) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
    ctx.fillStyle = '#0d0d1a'; ctx.fill();
    ctx.strokeStyle = '#a020f0'; ctx.lineWidth = 2.5;
    ctx.shadowColor = '#a020f0'; ctx.shadowBlur = 18; ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.fillStyle = '#a020f055';
    ctx.font = '600 0.85rem Rajdhani, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('sin participantes', cx, cy + R*0.6);
    ctx.restore();
    return;
  }

  const arc = (Math.PI * 2) / n;
  const ang = tabAngles[state.activeTab];

  for (let i = 0; i < n; i++) {
    const s = ang + i * arc;
    const e = s + arc;
    const color = cols[i % cols.length];
    ctx.save();
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, s, e); ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = '#07070f'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, R - 1, s, e);
    ctx.strokeStyle = color + 'aa'; ctx.lineWidth = 3;
    ctx.shadowColor = color; ctx.shadowBlur = 8; ctx.stroke();
    ctx.shadowBlur = 0; ctx.restore();

    ctx.save();
    const mid = ang + i * arc + arc / 2;
    ctx.translate(cx, cy);
    ctx.rotate(mid);

    // Text zone: from near hub to near edge
    const textStart = R * 0.20;
    const textEnd   = R * 0.92;
    const maxWidth  = textEnd - textStart;

    // Max font size based on arc opening at mid-radius
    const midR      = R * 0.60;
    const arcHeight = 2 * midR * Math.sin(arc / 2) * 0.85;
    let fs = Math.min(28, Math.max(9, Math.round(arcHeight * 0.9)));

    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    let label = names[i];

    // Shrink font until text fits width
    ctx.font = `700 ${fs}px 'Rajdhani', sans-serif`;
    while (fs > 9 && ctx.measureText(label).width > maxWidth) {
      fs--;
      ctx.font = `700 ${fs}px 'Rajdhani', sans-serif`;
    }
    // Truncate if still too wide at minimum size
    if (ctx.measureText(label).width > maxWidth) {
      while (label.length > 1 && ctx.measureText(label + '\u2026').width > maxWidth) {
        label = label.slice(0, -1);
      }
      label = label + '\u2026';
    }

    const centerX = textStart + maxWidth / 2;
    ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
    ctx.fillStyle = '#fff';
    ctx.fillText(label, centerX, 0);
    ctx.restore();
  }

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.strokeStyle = '#a020f0'; ctx.lineWidth = 3;
  ctx.shadowColor = '#a020f0'; ctx.shadowBlur = 20; ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.13, 0, Math.PI*2);
  ctx.fillStyle = '#050510'; ctx.fill();
  ctx.strokeStyle = '#a020f0'; ctx.lineWidth = 2;
  ctx.shadowColor = '#a020f0'; ctx.shadowBlur = 10; ctx.stroke();
  ctx.restore();
}

// ── SPIN ────────────────────────────────────────────────────────────────
function spin() {
  if (spinning) return;
  const names = currentWheel().names;
  if (names.length < 1) return;
  if (names.length === 1) { lastWinner = 0; showWinner(names[0]); return; }
  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  targetIdx = Math.floor(Math.random() * names.length);
  const n = names.length;
  const arc = (Math.PI * 2) / n;
  const tab = state.activeTab;
  const curAngle = tabAngles[tab];

  // The pointer is at angle 0 (right side of canvas).
  // Sector i starts at: curAngle + i*arc and ends at curAngle + (i+1)*arc.
  // We want the CENTER of sector targetIdx to land exactly at angle 0.
  // Center of sector targetIdx (in world space, before adding curAngle offset) = targetIdx*arc + arc/2
  // We need: finalAngle + targetIdx*arc + arc/2 ≡ 0  (mod 2π)
  // So: finalAngle = -(targetIdx*arc + arc/2)
  // delta = finalAngle - curAngle  (normalized so we always spin forward, i.e. subtract / negative direction)
  const targetAngleInWheel = targetIdx * arc + arc / 2;
  const desiredFinalAngle = -targetAngleInWheel;
  // How much do we need to rotate (always spin in negative direction = clockwise visually)
  let delta = ((curAngle - desiredFinalAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  if (delta < 0.01) delta = Math.PI * 2; // ensure at least one full spin
  const extra = (7 + Math.floor(Math.random() * 5)) * Math.PI * 2;
  const total = extra + delta;
  const dur = 4000 + Math.random() * 1500;
  const t0 = performance.now();
  const a0 = curAngle;

  function ease(t) { return 1 - Math.pow(1 - t, 4); }
  function frame(now) {
    const t = Math.min((now - t0) / dur, 1);
    tabAngles[tab] = a0 - total * ease(t);
    drawWheel();
    if (t < 1) { requestAnimationFrame(frame); }
    else {
      // Snap angle to exact position to avoid float drift
      tabAngles[tab] = desiredFinalAngle - extra * 0; // keep as-is, extra already applied
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      lastWinner = targetIdx;
      showWinner(names[targetIdx]);
    }
  }
  requestAnimationFrame(frame);
}

// ── WINNER ──────────────────────────────────────────────────────────────
function showWinner(name) {
  const eyebrowTexts = [
    '✨  EL PERSONAJE DE HOY ES..  ✨',
    '⏱  HOY EL TIEMPO ES..  ⏱',
    '🎮  HOY TOCA DESAFÍO..  🎮'
  ];
  document.getElementById('winnerName').textContent = name;
  document.getElementById('winnerTabBadge').textContent = TAB_NAMES[state.activeTab];
  document.getElementById('winnerEyebrow').textContent = eyebrowTexts[state.activeTab];
  document.getElementById('winnerOverlay').classList.add('show');
  launchConfetti();
}
document.getElementById('closeBtn').onclick = () => {
  document.getElementById('winnerOverlay').classList.remove('show');
  stopConfetti();
};
document.getElementById('removeCloseBtn').onclick = () => {
  if (lastWinner !== null && lastWinner < currentWheel().names.length) {
    currentWheel().names.splice(lastWinner, 1);
    lastWinner = null; save(); renderList(); drawWheel();
  }
  document.getElementById('winnerOverlay').classList.remove('show');
  stopConfetti();
};

// ── CONFETTI ────────────────────────────────────────────────────────────
const confC = document.getElementById('confettiCanvas');
const confX = confC.getContext('2d');
let pieces = [], confRunning = false, confRAF;
function launchConfetti() {
  confC.width = innerWidth; confC.height = innerHeight; pieces = [];
  const cols = ['#a020f0','#00f0ff','#ff00cc','#fff','#ffcc00','#7b2fff','#00ff88'];
  for (let i = 0; i < 140; i++) {
    pieces.push({ x: Math.random()*innerWidth, y: Math.random()*-innerHeight,
      w: 5+Math.random()*9, h: 4+Math.random()*5, c: cols[i%cols.length],
      r: Math.random()*Math.PI*2, rs: (Math.random()-.5)*.25,
      vx: (Math.random()-.5)*4, vy: 2+Math.random()*5 });
  }
  confRunning = true;
  (function anim() {
    if (!confRunning) return;
    confX.clearRect(0,0,confC.width,confC.height);
    pieces = pieces.filter(p => p.y < confC.height+20);
    pieces.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.r+=p.rs; p.vy+=0.06;
      confX.save(); confX.translate(p.x,p.y); confX.rotate(p.r);
      confX.fillStyle=p.c; confX.shadowColor=p.c; confX.shadowBlur=5;
      confX.fillRect(-p.w/2,-p.h/2,p.w,p.h); confX.restore();
    });
    if (pieces.length) confRAF = requestAnimationFrame(anim);
    else confX.clearRect(0,0,confC.width,confC.height);
  })();
}
function stopConfetti() {
  confRunning = false;
  if (confRAF) cancelAnimationFrame(confRAF);
  confX.clearRect(0,0,confC.width,confC.height);
}

// ── LIST ────────────────────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('namesList');
  const empty = document.getElementById('emptyState');
  const pill = document.getElementById('countPill');
  const names = currentWheel().names;
  const cols = getColors();
  pill.textContent = names.length;
  updateEditorCount();
  // Keep textarea in sync only when user is NOT actively typing
  const ta = document.getElementById('listEditor');
  if (ta && document.activeElement !== ta) ta.value = names.join('\n');
  if (names.length === 0) { empty.style.display='flex'; list.innerHTML=''; return; }
  empty.style.display = 'none'; list.innerHTML = '';
  names.forEach((name, i) => {
    const div = document.createElement('div'); div.className = 'name-item';
    const dot = document.createElement('div'); dot.className = 'name-dot';
    dot.style.background = cols[i%cols.length];
    dot.style.boxShadow = `0 0 6px ${cols[i%cols.length]}`;
    const span = document.createElement('span'); span.className = 'name-text';
    span.textContent = name;
    const del = document.createElement('button'); del.className = 'del-btn';
    del.textContent = '✕';
    del.onclick = () => { currentWheel().names.splice(i,1); save(); renderList(); drawWheel(); };
    div.appendChild(dot); div.appendChild(span); div.appendChild(del);
    list.appendChild(div);
  });
}

// ── LIVE EDITOR SYNC ────────────────────────────────────────────────────
function syncFromEditor() {
  const ta = document.getElementById('listEditor');
  const lines = ta.value.split('\n').map(l => l.trimEnd()).filter(l => l.trim() !== '');
  currentWheel().names = lines;
  save(); renderList(); drawWheel();
}
function populateEditor() {
  const ta = document.getElementById('listEditor');
  ta.value = currentWheel().names.join('\n');
  updateEditorCount();
}
function updateEditorCount() {
  const ta = document.getElementById('listEditor');
  const count = ta.value.split('\n').filter(l => l.trim() !== '').length;
  document.getElementById('editorCount').textContent = count + ' ítems';
}

// ── TABS ────────────────────────────────────────────────────────────────
function switchTab(idx) {
  state.activeTab = idx;
  // Update tab buttons
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', i === idx);
  });
  // Update panel title
  document.getElementById('panelTitle').textContent = '◈ ' + TAB_NAMES[idx];
  // Rebuild palette UI for this tab's palette
  buildPalette();
  renderList(); drawWheel();
  populateEditor();
  lastWinner = null;
  save();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(parseInt(btn.dataset.tab)));
});

// ── PALETTE ─────────────────────────────────────────────────────────────
function buildPalette() {
  const row = document.getElementById('palRow');
  row.innerHTML = '';
  const curPal = currentWheel().palette;
  const labels = { cyberpunk:'Cyber', neon:'Neon', galaxy:'Galaxy', fire:'Fire' };
  Object.entries(PALETTES).forEach(([key, cols]) => {
    const b = document.createElement('button');
    b.className = 'pal-btn' + (key === curPal ? ' active' : '');
    b.style.background = `linear-gradient(90deg, ${cols[0]}, ${cols[2]}, ${cols[4]})`;
    b.title = labels[key];
    b.onclick = () => {
      currentWheel().palette = key;
      document.querySelectorAll('.pal-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      save(); drawWheel(); renderList();
    };
    row.appendChild(b);
  });
}

// ── EVENTS ──────────────────────────────────────────────────────────────
document.getElementById('listEditor').addEventListener('input', () => {
  syncFromEditor();
  updateEditorCount();
});
document.getElementById('listEditor').addEventListener('blur', () => {
  syncFromEditor();
  updateEditorCount();
});
document.getElementById('spinBtn').onclick = spin;
document.getElementById('centerAvatar').onclick = spin;
document.getElementById('shuffleBtn').onclick = () => {
  const n = currentWheel().names;
  for (let i=n.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1)); [n[i],n[j]]=[n[j],n[i]];
  }
  save(); renderList(); drawWheel();
};
document.getElementById('sortBtn').onclick = () => {
  currentWheel().names.sort((a,b)=>a.localeCompare(b));
  save(); renderList(); drawWheel();
};
document.getElementById('removeWinnerBtn').onclick = () => {
  if (lastWinner!==null && lastWinner<currentWheel().names.length) {
    currentWheel().names.splice(lastWinner,1); lastWinner=null;
    save(); renderList(); drawWheel();
  }
};
document.getElementById('clearBtn').onclick = () => {
  if (confirm('¿Borrar todos en esta ruleta?')) {
    currentWheel().names=[]; lastWinner=null;
    save(); renderList(); drawWheel();
  }
};
window.addEventListener('resize', sizeWheel);

// ── INIT ────────────────────────────────────────────────────────────────
load();
// Seed defaults if all empty
const allEmpty = state.wheels.every(w => w.names.length === 0);
if (allEmpty) {
  state.wheels[0].names = ['Guerrero','Mago','Arquero','Asesino','Paladin'];
  state.wheels[1].names = ['30 seg','1 min','2 min','5 min','Sin límite'];
  state.wheels[2].names = ['Desafío 1','Desafío 2','Desafío 3','Desafío 4'];
  save();
}

switchTab(state.activeTab);
buildPalette();
sizeWheel();
populateEditor();
</script>
